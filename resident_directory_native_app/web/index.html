<!DOCTYPE html>
<html>
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Resident Directory app" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resident Directory</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <style>
      body { background: #f9fafb; margin: 0; }
      #loading { display:flex; align-items:center; justify-content:center; height:100vh; color:#111827; font-family: Arial, Helvetica, sans-serif; }
      .spinner { width: 28px; height: 28px; border: 3px solid rgba(0,0,0,0.1); border-top-color: #2563EB; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loading"><div class="spinner"></div>Loading...</div>
    <script src="flutter.js" defer></script>
    <script>
      window.addEventListener('load', function(ev) {
        _flutter.loader.loadEntrypoint({}).then(function(engineInitializer) {
          return engineInitializer.initializeEngine();
        }).then(function(appRunner) {
          document.getElementById('loading')?.remove();
          return appRunner.runApp();
        });
      });
    </script>
  </body>
</html>
